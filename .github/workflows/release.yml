name: Release

# Tag with the exact version, no `v` prefix, matching `version` in gradle.properties.
# Both registries are append-only: a published version can never be replaced or deleted.
# Shake the workflow out on a prerelease tag (0.1.0-alpha01) before tagging 0.1.0.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  # Rehearsal: publishes only the shared NuGet contract, at the prerelease version typed here, and
  # stops before Maven Central and the Plugin Portal. It proves the nuget.org Trusted Publishing
  # policy and the GitHub Packages push without a tag. nuget.org never deletes a version, so the
  # rehearsal version stays there for good; unlist it afterwards.
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease contract version to publish, e.g. 0.9.0-rehearsal.1
        required: true
        type: string

jobs:
  release:
    name: Publish
    # macOS so the by-coordinate smoke test can run: its fixture declares a macosArm64 target,
    # and that gate must pass before anything reaches a registry.
    runs-on: macos-latest

    permissions:
      contents: read
      # nuget.org Trusted Publishing exchanges this job's OIDC token for a short-lived key.
      id-token: write
      # The contract is mirrored to GitHub Packages.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tag is the only thing a human types. If it disagrees with the version the artifacts
      # will actually carry, stop here rather than publish a mislabelled release that can't be
      # taken back. A rehearsal must name a prerelease, so it can never burn a release version.
      - name: Resolve the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! printf '%s' "$REHEARSAL_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-z.-]+$'; then
              echo "::error::rehearsal version '$REHEARSAL_VERSION' is not a lowercase prerelease such as 0.9.0-rehearsal.1"
              exit 1
            fi
            version="$REHEARSAL_VERSION"
            echo "Rehearsing the contract publish at $version"
          else
            version="$(grep '^version=' gradle.properties | cut -d= -f2)"
            if [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::tag '$GITHUB_REF_NAME' does not match gradle.properties version '$version'"
              exit 1
            fi
            echo "Releasing $version"
          fi
          echo "CONTRACT_VERSION=$version" >> "$GITHUB_ENV"
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}

      - name: Plugin tests
        if: github.event_name == 'push'
        run: ./gradlew :nuget-plugin:test

      # Publish to a local file repo and resolve the plugin from a separate Gradle build, exactly
      # as a consumer does. This is the last chance to catch a broken coordinate fallback while
      # the mistake is still free.
      - name: Verify the consumer path
        if: github.event_name == 'push'
        run: |
          ./gradlew \
            :nuget-processor:publishAllPublicationsToLocalTestRepository \
            :nuget-runtime:publishAllPublicationsToLocalTestRepository \
            :nuget-annotations:publishAllPublicationsToLocalTestRepository \
            :nuget-plugin:publishAllPublicationsToLocalTestRepository
          ./gradlew -p smoke-test verifyProcessorResolvesByCoordinate verifyRuntimeResolvesByCoordinate \
            verifyAnnotationsPluginResolvesByCoordinate

      # The contract goes first and must be listed before anything else is published: every
      # generated package depends on `Xxfast.Kotlin.Native.Interop` from this version up, so a plugin
      # release without it does not restore for any C# consumer. It is versioned in lockstep with
      # the plugin (its csproj reads gradle.properties), so each release pushes a new version; on a tag
      # `CONTRACT_VERSION` is that same version, and only a rehearsal overrides it.
      # `--skip-duplicate` only lets a failed run be retried after the push already went through.
      - name: Verify and pack the shared NuGet contract
        run: |
          dotnet test ContractTests
          dotnet pack Kotlin.Native.Interop -c Release -o build/nuget -p:PackageVersion="$CONTRACT_VERSION"

      # Trusted Publishing: the nuget.org policy names this repository and this workflow file, so
      # renaming `release.yml` breaks publishing until the policy is updated. The key is
      # short-lived, so this step stays directly before the push.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: xxfast

      - name: Publish the shared NuGet contract
        run: |
          dotnet nuget push build/nuget/Xxfast.Kotlin.Native.Interop.*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push build/nuget/Xxfast.Kotlin.Native.Interop.*.nupkg \
            --source https://nuget.pkg.github.com/xxfast/index.json \
            --api-key "$GITHUB_TOKEN" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # nuget.org accepts a push and validates it afterwards. Wait until this exact version can be
      # restored, so the irreversible steps below never run against a contract that failed validation.
      - name: Wait for nuget.org to list the contract
        run: |
          version="$CONTRACT_VERSION"
          url="https://api.nuget.org/v3-flatcontainer/xxfast.kotlin.native.interop/$version/xxfast.kotlin.native.interop.nuspec"
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null "$url"; then
              echo "Xxfast.Kotlin.Native.Interop $version is listed"
              exit 0
            fi
            echo "Not listed yet ($attempt/60)"
            sleep 30
          done
          echo "::error::Xxfast.Kotlin.Native.Interop $version was not listed on nuget.org within 30 minutes"
          exit 1

      # No automaticRelease: every deployment waits for a manual "Publish" at central.sonatype.com.
      # `nuget-plugin` is an included build, so it is a separate Central deployment from
      # `nuget-processor` and `nuget-runtime`, and needs its own approval. The runtime ships here
      # too (ADR-127): the plugin resolves `io.github.xxfast:nuget-runtime:<version>` by coordinate
      # in every consumer, so a release without it does not resolve outside this repository.
      - name: Publish to Maven Central
        if: github.event_name == 'push'
        run: >
          ./gradlew --no-configuration-cache
          :nuget-processor:publishToMavenCentral
          :nuget-runtime:publishToMavenCentral
          :nuget-annotations:publishToMavenCentral
          :nuget-plugin:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}

      # The Plugin Portal publishes immediately and irreversibly, so it goes last: if Central
      # rejects the credentials or the signature, nothing has been made permanent yet.
      - name: Publish to the Gradle Plugin Portal
        if: github.event_name == 'push'
        run: ./gradlew --no-configuration-cache :nuget-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

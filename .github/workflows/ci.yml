name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The reverse dogfooding census (the `reverse-census` job) is the only thing these two add. It restores
  # nine real published packages from nuget.org, so it runs on a schedule and on demand rather than
  # on every push, and it is never a required check.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# A new push to a pull request supersedes the run before it. Every other event gets a group of its
# own: a shared group would cancel a pending run on main whenever a newer one queued behind it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The processor and plugin tests need no Kotlin/Native link and nothing below needs their
  # output, so they run beside the `bridge` job rather than in front of it. These previously ran
  # only in release.yml, on a tag, so a PR could break them and CI stayed green until release day.
  # One job per suite: the processor's tests alone are the longest thing in the workflow, so the
  # plugin's run beside them instead of after.
  #
  # Named by direction: the processor suite is the forward generator (Kotlin to C#), the plugin
  # suite is the reverse generator (C# to Kotlin) together with the plugin's own task wiring.
  generators:
    name: ${{ matrix.title }} (${{ matrix.os }})
    strategy:
      matrix:
        host: [unix, windows]
        suite: [processor, plugin]
        include:
          - suite: processor
            title: Forward generator
            gradle: ./gradlew :nuget-processor:koverXmlReport
            report: nuget-processor/build/reports/kover/report.xml
          # nuget-plugin is a composite includeBuild, so its task is addressed with -p nuget-plugin.
          - suite: plugin
            title: Reverse generator and plugin
            gradle: ./gradlew -p nuget-plugin koverXmlReport
            report: nuget-plugin/build/reports/kover/report.xml
          - host: windows
            os: windows-latest
          # The processor's tests are JVM only (in-process KSP, generated text asserted as strings),
          # so their unix leg runs on Ubuntu and leaves a macOS runner free. The free plan caps
          # concurrent macOS jobs at 5 across the account, and two overlapping runs queue on it.
          - host: unix
            suite: processor
            os: ubuntu-latest
          # The plugin's tests are host-specific (they compile generated Kotlin with the host
          # kotlinc-native and resolve host RIDs), so their unix leg stays on macOS.
          - host: unix
            suite: plugin
            os: macos-latest

    runs-on: ${{ matrix.os }}
    # Same reason as `bridge` below: not a job the weekly census schedule should pay for.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The plugin's integration tests run the NugetMetadataReader console app.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # koverXmlReport runs the tests and writes the JaCoCo-compatible XML in one pass.
      - name: Unit tests with coverage
        run: ${{ matrix.gradle }}

      # Public repo works tokenless, but the token is wired for correctness and in case the
      # repo ever goes private. Uploads run only on the unix leg: coverage paths are identical
      # across the matrix and one upload per report keeps the Codecov flags unambiguous.
      - name: Upload Kotlin coverage to Codecov
        if: always() && matrix.host == 'unix'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: kotlin
          fail_ci_if_error: false
          files: ${{ matrix.report }}

  # The packed bridge, driven from C#. One serial chain per OS because every C# suite consumes the
  # same packed test-library. Step names carry their stage: Runtime, Contract, Pack, Compile,
  # Behaviour, Coexistence, AOT, Leaks. The leak harness is the slowest suite, so it runs last and
  # a failure in a cheaper stage does not wait behind it.
  bridge:
    name: Bridge end to end (${{ matrix.os }})
    strategy:
      # One leg's failure must not cancel the others and hide whether they pass.
      fail-fast: false
      matrix:
        include:
          # `runtime_extra` names further runtime tasks for the leg; `native_library` is the host's
          # linked test-library binary, which the runtime-exports check reads.
          - os: macos-latest
            runtime_test: macosArm64Test
            runtime_extra: ""
            native_library: test-library/build/bin/macosArm64/releaseShared/libkn_testlibrary.dylib
            aot_rid: osx-arm64
            aot_binary: ./AotSmokeTest/bin/Release/net10.0/osx-arm64/publish/AotSmokeTest
            aot_tests_binary: ./AotIntegrationTests/bin/Release/net10.0/osx-arm64/publish/AotIntegrationTests
            aot_leak_binary: ./AotLeakTests/bin/Release/net10.0/osx-arm64/publish/AotLeakTests
          - os: windows-latest
            runtime_test: mingwX64Test
            runtime_extra: ""
            native_library: test-library/build/bin/mingwX64/releaseShared/kn_testlibrary.dll
            aot_rid: win-x64
            aot_binary: ./AotSmokeTest/bin/Release/net10.0/win-x64/publish/AotSmokeTest.exe
            aot_tests_binary: ./AotIntegrationTests/bin/Release/net10.0/win-x64/publish/AotIntegrationTests.exe
            aot_leak_binary: ./AotLeakTests/bin/Release/net10.0/win-x64/publish/AotLeakTests.exe
          # The Linux leg also compiles the linuxArm64 runtime klib: nothing else on a pull request
          # builds that target, and `linux-arm64` is a RID the plugin maps.
          - os: ubuntu-latest
            runtime_test: linuxX64Test
            runtime_extra: ":nuget-runtime:compileKotlinLinuxArm64"
            native_library: test-library/build/bin/linuxX64/releaseShared/libkn_testlibrary.so
            aot_rid: linux-x64
            aot_binary: ./AotSmokeTest/bin/Release/net10.0/linux-x64/publish/AotSmokeTest
            aot_tests_binary: ./AotIntegrationTests/bin/Release/net10.0/linux-x64/publish/AotIntegrationTests
            aot_leak_binary: ./AotLeakTests/bin/Release/net10.0/linux-x64/publish/AotLeakTests

    runs-on: ${{ matrix.os }}
    # The weekly schedule and workflow_dispatch above exist only for the `reverse-census` job, and a
    # workflow-level trigger fires every job in the file. This matrix pays for three Kotlin/Native
    # links and three AOT publishes, so it stays on push and pull_request only.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ADR-128: the `launchForCSharp` / `collectForCSharp` runtime helpers run in-process here, on
      # every leg, so a broken coroutine arm fails before the pack rather than inside a dotnet test.
      # The host's test task by name: `allTests` also links the targets it cannot run.
      - name: "Runtime: helper tests"
        run: ./gradlew :nuget-runtime:${{ matrix.runtime_test }} ${{ matrix.runtime_extra }}

      - name: "Contract: verify and pack the shared compiled contract"
        run: |
          dotnet test ContractTests
          dotnet pack Kotlin.Native.Interop -c Release -o build/nuget

      - name: "Contract: mixed compatible dependency floors restore together"
        run: bash scripts/verify-contract-version-ranges.sh
        shell: bash

      - name: "Pack: both independent NuGet publishers"
        run: ./gradlew :test-library:packNuget :test-companion:packNuget

      - name: "Pack: forward diagnostics include the late publisher on cached builds"
        run: scripts/verify-forward-diagnostics.sh
        shell: bash

      # ADR-127 seam 3 runs on every matrix leg: the runtime's `nuget_*` exports were only ever
      # spiked on macosArm64, so checking the linked library here turns a missing export into a
      # build failure instead of an `EntryPointNotFoundException` in the dotnet tests below.
      # The library is named per leg because every host cross-links the other targets too, and
      # the script's no-argument search would otherwise pick a binary the host's `nm` cannot read.
      # Under Git Bash on the Windows runner `$HOME` is the user profile, so the script's
      # `~/.konan/dependencies/msys2-mingw-w64-x86_64-*/bin/nm.exe` glob resolves there too.
      - name: "Pack: runtime exports present in the linked library"
        run: scripts/verify-runtime-exports.sh ${{ matrix.native_library }}
        shell: bash

      - name: "Compile: generated bindings as a consumer (net10.0, warnings as errors)"
        run: dotnet build GeneratedBindingsCheck

      - name: "Behaviour: build IntegrationTests"
        run: dotnet build IntegrationTests

      - name: "Behaviour: list test output"
        if: runner.os == 'Windows'
        run: ls IntegrationTests/bin/Debug/net10.0/
        shell: bash

      # One suite, two runs, split on the `Direction` trait. A test is reverse when what it asserts
      # crosses a binding generated from a NuGet dependency (`[Trait("Direction", "Reverse")]` on
      # the class or the method); everything untagged is forward. The two filters are complements,
      # so every test runs in exactly one of them and a new, untagged test lands in forward.
      - name: "Behaviour: forward, Kotlin exported to C# (IntegrationTests with coverage)"
        run: >
          dotnet test IntegrationTests --no-build
          --filter "Direction!=Reverse"
          --collect:"XPlat Code Coverage"
          --results-directory IntegrationTests/TestResults

      - name: "Behaviour: reverse, NuGet consumed from Kotlin (IntegrationTests with coverage)"
        run: >
          dotnet test IntegrationTests --no-build
          --filter "Direction=Reverse"
          --collect:"XPlat Code Coverage"
          --results-directory IntegrationTests/TestResults

      - name: "Coexistence: independent native runtimes with coverage"
        run: >
          dotnet test MultiPackageTests
          --collect:"XPlat Code Coverage"
          --results-directory MultiPackageTests/TestResults

      - name: "Coexistence: shared exception identity across consumer assemblies"
        run: dotnet test SharedExceptionTests

      # ADR-102: the forward callback surface (flow, suspend, per-call lambda, stored callback,
      # interface bridge) dispatches through [UnmanagedCallersOnly] thunks so it needs no JIT.
      # This console app asserts via its exit code and prints a flushed label per shape, so a
      # process-fatal callback failure is attributed before the AOT test binaries below run.
      # A contract/regression lane, not a red-to-green proof: NativeAOT passed before the thunks
      # too (ILC pre-generates delegate marshalling stubs) and must keep passing through them.
      # Runs in the default shell deliberately - under bash on Windows the ILC link step fails
      # to resolve vswhere.exe.
      - name: "AOT: publish smoke test (${{ matrix.aot_rid }})"
        run: dotnet publish AotSmokeTest -r ${{ matrix.aot_rid }} -c Release -p:PublishAot=true

      - name: "AOT: run smoke test (${{ matrix.aot_rid }})"
        run: ${{ matrix.aot_binary }}

      # ADR-120's live-handle counter is process-global, so the leak harness needs a test process
      # of its own: sharing one with the other ~1550 tests let their cleaners move the count during
      # a measurement window, which went red on Windows for rows that mint no handle at all.
      - name: "Leaks: build harness"
        run: dotnet build LeakTests

      - name: "Leaks: run harness with coverage"
        run: >
          dotnet test LeakTests --no-build
          --collect:"XPlat Code Coverage"
          --results-directory LeakTests/TestResults

      # Rung 8 of the zero-leak evidence ladder: the same IntegrationTests and LeakTests sources,
      # published with NativeAOT on xunit.v3's source-generated runner and run as plain binaries.
      # Exit 0 means every test passed; the runner exits non-zero on any failure (2) or when no
      # test ran (8). Two binaries because LiveHandles is process-global, and the leak binary gets
      # `--parallel none` so its serial guarantee does not depend on finding xunit.runner.json.
      # Last because they are the slowest steps. Default shell for the same vswhere.exe reason as
      # the smoke test above.
      - name: "AOT: publish IntegrationTests (${{ matrix.aot_rid }})"
        run: dotnet publish AotIntegrationTests -r ${{ matrix.aot_rid }} -c Release -p:PublishAot=true

      - name: "AOT: run IntegrationTests (${{ matrix.aot_rid }})"
        run: ${{ matrix.aot_tests_binary }}

      - name: "AOT: publish leak harness (${{ matrix.aot_rid }})"
        run: dotnet publish AotLeakTests -r ${{ matrix.aot_rid }} -c Release -p:PublishAot=true

      - name: "AOT: run leak harness (${{ matrix.aot_rid }})"
        run: ${{ matrix.aot_leak_binary }} --parallel none

      # Same upload rules as the Kotlin report in the `generators` job: tokenless works, macos-latest only.
      - name: Upload C# coverage to Codecov
        if: always() && matrix.os == 'macos-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: csharp
          fail_ci_if_error: false
          files: IntegrationTests/TestResults/**/coverage.cobertura.xml,LeakTests/TestResults/**/coverage.cobertura.xml,MultiPackageTests/TestResults/**/coverage.cobertura.xml

  # Consumes the plugin the way a real user does: by maven coordinate, from a separate Gradle
  # build. In this repo `NugetPlugin` always finds `:nuget-processor` as a project, so the
  # coordinate fallback it ships to consumers is otherwise never executed.
  #
  # ADR-195: one leg per end of the supported Kotlin range, and each leg proves two things about
  # the artifacts published on the repo's pinned compiler. First they are consumable from that
  # Kotlin (the smoke consumer resolves and links them). Then they behave: `fixture-consumer/`
  # builds test-library and test-companion against them with that Kotlin, and the real dotnet
  # tests run. Folded into one job per version to stay inside the free plan's 5 concurrent macOS
  # jobs. The names resolve through kotlinFloor and kotlinTested in gradle.properties; never put a
  # number here.
  #
  # Step names carry which of the two a step belongs to: `Published artifacts:` and
  # `Consumer behaviour:`. Neither rebuilds the tooling on this leg's Kotlin. That is the point: a
  # consumer gets the plugin, processor and klibs as released, and only their own code is compiled
  # by their Kotlin.
  consumer:
    name: Consumer on Kotlin ${{ matrix.kotlin }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin: [floor, tested]
    # Same reason as `bridge` above: not a job the weekly census schedule should pay for.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # The path filter below diffs against the merge base, which needs more than one commit.
          fetch-depth: 0

      # Deliberately the lowest JVM a Gradle 9 consumer can be on. This build's own daemon runs on
      # 21 (gradle/gradle-daemon-jvm.properties), so resolving the plugin here on 17 is what proves
      # the published metadata doesn't demand a newer JVM than consumers have. Do not raise this.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # No kotlinVersion override here: these are the artifacts a release ships, built on the pin.
      # The link needs the runtime and annotations klibs too. The smoke consumer targets macosArm64
      # only, but the fixtures pack a mingwX64 library as well and a macOS host links it, so both
      # targets' publications go up beside the metadata one. The linuxX64 ones are not linked on
      # this macOS leg (the fixtures declare that target on Linux hosts only); they are published so
      # the local repo carries every target the fixtures can declare.
      - name: "Published artifacts: publish plugin, processor, runtime and annotations to a local maven repo"
        run: >
          ./gradlew
          :nuget-processor:publishAllPublicationsToLocalTestRepository
          :nuget-runtime:publishMacosArm64PublicationToLocalTestRepository
          :nuget-runtime:publishMingwX64PublicationToLocalTestRepository
          :nuget-runtime:publishLinuxX64PublicationToLocalTestRepository
          :nuget-runtime:publishKotlinMultiplatformPublicationToLocalTestRepository
          :nuget-annotations:publishMacosArm64PublicationToLocalTestRepository
          :nuget-annotations:publishMingwX64PublicationToLocalTestRepository
          :nuget-annotations:publishLinuxX64PublicationToLocalTestRepository
          :nuget-annotations:publishKotlinMultiplatformPublicationToLocalTestRepository
          :nuget-plugin:publishAllPublicationsToLocalTestRepository

      - name: "Published artifacts: resolve by coordinate and link at Kotlin ${{ matrix.kotlin }}"
        run: >
          ./gradlew -p smoke-test
          verifyProcessorResolvesByCoordinate
          verifyRuntimeResolvesByCoordinate
          verifyAnnotationsPluginResolvesByCoordinate
          linkDebugSharedMacosArm64
          -Psmoke.kotlin=${{ matrix.kotlin }}

      # `Published artifacts:` above runs on every pull request: it is the only place CI resolves
      # the tooling by coordinate. `Consumer behaviour:` below is the expensive half (a second pack,
      # the C# suites and the leak harness, 12 to 18 minutes a leg), so on a pull request it runs
      # only when the change touches what decides which Kotlin builds what: the version pins and
      # build files, the plugin, the runtime and annotations klibs, the smoke consumer, the fixture consumer
      # root and this workflow. A push to main always runs it, so a processor or fixture change that only one end
      # of the range rejects is caught there, after merge. That is a deliberate coverage trade.
      - name: "Consumer behaviour: decide whether this change can move it"
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          # A diff that cannot be computed runs the stage: skipping is the unsafe default.
          if ! changed=$(git diff --name-only "$base"...HEAD); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(gradle\.properties|settings\.gradle\.kts|build\.gradle\.kts|gradle/|[^/]+/build\.gradle\.kts|[^/]+/settings\.gradle\.kts|nuget-plugin/|nuget-runtime/|nuget-annotations/|smoke-test/|fixture-consumer/|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # No coverage and no AOT publish: the `bridge` job owns those on the pinned version.
      - name: "Consumer behaviour: verify and pack shared compiled contract"
        if: steps.range.outputs.run == 'true'
        run: |
          dotnet test ContractTests
          dotnet pack Kotlin.Native.Interop -c Release -o build/nuget

      # `fixture-consumer/` is a second root over the same fixture project directories. In it the
      # processor, runtime and annotations are not projects, so the plugin resolves them by
      # coordinate from the local repo published above, and only the fixtures are compiled by this
      # leg's Kotlin. The packages land where the root build puts them, so the suites below need
      # no change.
      - name: "Consumer behaviour: build the fixtures as an outside consumer at Kotlin ${{ matrix.kotlin }}"
        if: steps.range.outputs.run == 'true'
        run: >
          ./gradlew -p fixture-consumer
          :test-library:packNuget
          :test-companion:packNuget
          -Pconsumer.kotlin=${{ matrix.kotlin }}

      # The klib manifest records the compiler that built it. Two checks, because the shape under
      # test is two compilers: the fixture by this leg's Kotlin (a silently ignored
      # `consumer.kotlin` fails here), and the published runtime by the repo's pin (a runtime
      # rebuilt on this leg's Kotlin would be the old, wrong shape).
      - name: "Consumer behaviour: prove the fixture and the runtime came from different compilers"
        if: steps.range.outputs.run == 'true'
        shell: bash
        run: |
          case "${{ matrix.kotlin }}" in
            floor) key=kotlinFloor ;;
            tested) key=kotlinTested ;;
          esac
          expected=$(grep "^$key=" gradle.properties | cut -d= -f2)
          manifest=test-library/build/classes/kotlin/macosArm64/main/klib/test-library/default/manifest
          actual=$(grep '^compiler_version=' "$manifest" | cut -d= -f2)
          echo "test-library compiled by Kotlin $actual (expected $expected)"
          test "$actual" = "$expected"

          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          pin=$(grep '^kotlin = ' gradle/libs.versions.toml | cut -d'"' -f2)
          klib="build/local-repo/io/github/xxfast/nuget-runtime-macosarm64/$version/nuget-runtime-macosarm64-$version.klib"
          runtime=$(unzip -p "$klib" default/manifest | grep '^compiler_version=' | cut -d= -f2)
          echo "nuget-runtime $version compiled by Kotlin $runtime (expected the pin, $pin)"
          test "$runtime" = "$pin"

      - name: "Consumer behaviour: run IntegrationTests"
        if: steps.range.outputs.run == 'true'
        run: dotnet test IntegrationTests

      - name: "Consumer behaviour: run leak harness"
        if: steps.range.outputs.run == 'true'
        run: dotnet test LeakTests

  # The reverse dogfooding census: the real plugin pipeline over nine pinned published NuGet
  # packages, compared against the committed goldens in nuget-plugin/src/test/resources/dogfood.
  # Deliberately NOT a required check: it reaches nuget.org, and a feed outage must not block a
  # merge. On a pull request it only runs when the change touches something that can move a census
  # number; it always runs on the weekly schedule and on workflow_dispatch. No Kotlin/Native
  # toolchain is needed, so this is the cheapest runner class in the workflow.
  reverse-census:
    name: Reverse census over real packages
    runs-on: ubuntu-latest
    # Pull requests (path-filtered in the first step below), the weekly schedule and on demand. NOT
    # on push: a merge to main has already had this run on its pull request.
    if: github.event_name != 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          # The path filter below diffs against the merge base, which needs more than one commit.
          fetch-depth: 0

      - name: Decide whether this change can move a census number
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          changed=$(git diff --name-only "$base"...HEAD || true)
          echo "changed files:"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(NugetMetadataReader/|nuget-plugin/src/main/kotlin/io/github/xxfast/kotlin/native/nuget/rir/|nuget-plugin/src/main/kotlin/io/github/xxfast/kotlin/native/nuget/NugetGenerateBindingsTask\.kt|nuget-plugin/src/main/kotlin/io/github/xxfast/kotlin/native/nuget/NugetGenerateShimsTask\.kt|nuget-plugin/src/test/resources/dogfood/|nuget-plugin/src/test/kotlin/io/github/xxfast/kotlin/native/nuget/(DogfoodCensusTest|RirCensusTest|RealPackageFixture)\.kt|scripts/verify-dogfood\.sh|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.filter.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.filter.outputs.run == 'true'

      - uses: actions/setup-dotnet@v4
        if: steps.filter.outputs.run == 'true'
        with:
          dotnet-version: 10.0.x

      # Keyed on the pinned package list, so a warm run never touches the feed at all and a version
      # bump invalidates the cache exactly once.
      - name: Cache the global NuGet package cache
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: dogfood-nuget-${{ hashFiles('nuget-plugin/src/test/resources/dogfood/packages.json') }}
          restore-keys: dogfood-nuget-

      - name: Reverse census
        if: steps.filter.outputs.run == 'true'
        run: ./gradlew -p nuget-plugin dogfoodCensus

#Published coordinates
# Single source of truth for the version. The `nuget-plugin` included build does not
# inherit these across the composite boundary, so it reads this file explicitly.
group=io.github.xxfast
version=0.8.0

#Kotlin range (ADR-195): the floor is major.minor.0 of the Kotlin that builds the published klibs;
# tested is the highest Kotlin the CI smoke leg has linked. Read by nuget-plugin and smoke-test.
kotlinFloor=2.4.0
kotlinTested=2.4.20

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
